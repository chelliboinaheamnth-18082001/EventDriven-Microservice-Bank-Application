server:
  port: 8081
spring:
  application:
    name: "accounts"
  datasource:
    url: jdbc:h2:file:~/accounts;AUTO_SERVER=true
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

#  cloud:
#    function:
#      definition: updateAccountMobileNumber
#    stream:
#      defaultBinder: kafka
#      bindings:
#        updateAccountMobileNumber-in-0:
#          destination: update-account-mobile-number
#          group: ${spring.application.name}
#        updateCardMobileNumber-out-0:
#          destination: update-card-mobile-number

  cloud:
    function:
      definition: updateAccountMobileNumber;rollbackAccountMobileNumber
    stream:
      defaultBinder: kafka
      bindings:
        updateAccountMobileNumber-in-0:
          destination: update-account-mobile-number
          group: ${spring.application.name}
        rollbackAccountMobileNumber-in-0:
          destination: rollback-account-mobile-number
          group: ${spring.application.name}
        updateCardMobileNumber-out-0:
          destination: update-card-mobile-number
        rollbackCustomerMobileNumber-out-0:
          destination: rollback-customer-mobile-number
      kafka:
        binder:
          brokers: localhost:9092
          autoCreateTopics: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

info:
  app:
    name: "accounts"
    description: "HBank Accounts Application"
    version: "1.0.0"

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"